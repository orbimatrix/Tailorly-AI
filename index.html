<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TailorAI - Body Measurement</title>
    <style>
        :root {
            --primary-color: #6366f1;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            padding: 20px;
            text-align: center;
            background-color: var(--card-bg);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin: 0;
            font-weight: 700;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        main {
            max-width: 800px;
            width: 100%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            justify-content: center;
        }

        .tab-btn {
            background-color: var(--card-bg);
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .tab-btn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .camera-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            background-color: #000;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video, canvas, #resultImage, #uploadedImagePreview {
            width: 100%;
            display: block;
        }
        
        #resultImage, #uploadedImagePreview {
            display: none;
        }

        /* Guide Overlay */
        .guide-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 80%;
            border: 2px dashed rgba(255, 255, 255, 0.5);
            border-radius: 50px;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .guide-text {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.2rem;
            text-align: center;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 8px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            max-width: 640px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.9rem;
            color: #94a3b8;
        }

        input[type="number"], input[type="file"] {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #334155;
            color: white;
            font-size: 1rem;
        }
        
        input[type="file"] {
            cursor: pointer;
        }

        button {
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: var(--primary-color);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #4f46e5;
        }
        
        button.secondary {
            background-color: #475569;
        }
        
        button.secondary:hover {
            background-color: #64748b;
        }

        #results {
            margin-top: 20px;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            display: none;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #334155;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .loading {
            display: none;
            text-align: center;
            color: #94a3b8;
        }
        
        /* Upload Mode Styles */
        .upload-placeholder {
            color: #94a3b8;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <h1>TailorAI Measurement</h1>
    </header>

    <main>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('camera')">Camera</button>
            <button class="tab-btn" onclick="switchTab('upload')">Upload Photo</button>
        </div>

        <div class="camera-container">
            <video id="video" autoplay playsinline></video>
            <img id="uploadedImagePreview" alt="Upload Preview">
            <img id="resultImage" alt="Processed Image">
            <canvas id="canvas" style="display:none;"></canvas>
            
            <div id="guideOverlay" class="guide-overlay">
                <div class="guide-text">Stand here<br>Full body visible</div>
            </div>
            
            <div id="uploadPlaceholder" class="upload-placeholder" style="display:none;">
                <p>No image selected</p>
            </div>
        </div>

        <div class="controls">
            <div class="input-group">
                <label for="height">Your Height (cm)</label>
                <input type="number" id="height" placeholder="e.g., 175" value="170">
            </div>
            
            <div id="fileInputGroup" class="input-group" style="display:none;">
                <label for="fileInput">Select Photo</label>
                <input type="file" id="fileInput" accept="image/*">
            </div>

            <button id="captureBtn">Capture & Measure</button>
            <button id="resetBtn" class="secondary" style="display:none;">Start Over</button>
        </div>

        <div id="loading" class="loading">Processing image...</div>

        <div id="results">
            <h3>Measurements</h3>
            <div class="result-item">
                <span>Shoulder Width</span>
                <span id="shoulderWidth">-</span>
            </div>
            <div class="result-item">
                <span>Hip Width</span>
                <span id="hipWidth">-</span>
            </div>
            <div class="result-item">
                <span>Arm Length</span>
                <span id="armLength">-</span>
            </div>
        </div>
    </main>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const resultImage = document.getElementById('resultImage');
        const uploadedImagePreview = document.getElementById('uploadedImagePreview');
        const guideOverlay = document.getElementById('guideOverlay');
        const uploadPlaceholder = document.getElementById('uploadPlaceholder');
        
        const captureBtn = document.getElementById('captureBtn');
        const resetBtn = document.getElementById('resetBtn');
        const heightInput = document.getElementById('height');
        const fileInput = document.getElementById('fileInput');
        const fileInputGroup = document.getElementById('fileInputGroup');
        
        const resultsDiv = document.getElementById('results');
        const loadingDiv = document.getElementById('loading');
        
        let currentMode = 'camera'; // 'camera' or 'upload'
        let stream = null;

        // Tab Switching
        window.switchTab = function(mode) {
            currentMode = mode;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            resetUI();

            if (mode === 'camera') {
                startCamera();
                video.style.display = 'block';
                guideOverlay.style.display = 'flex';
                uploadPlaceholder.style.display = 'none';
                uploadedImagePreview.style.display = 'none';
                fileInputGroup.style.display = 'none';
                captureBtn.textContent = 'Capture & Measure';
            } else {
                stopCamera();
                video.style.display = 'none';
                guideOverlay.style.display = 'none';
                uploadPlaceholder.style.display = 'block';
                uploadedImagePreview.style.display = 'none';
                fileInputGroup.style.display = 'flex';
                captureBtn.textContent = 'Measure Uploaded Photo';
            }
        };

        // Access Camera
        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
            } catch (err) {
                console.error("Error accessing camera:", err);
                alert("Could not access camera.");
            }
        }
        
        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
        }

        // Initial Start
        startCamera();

        // File Input Handling
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    uploadedImagePreview.src = e.target.result;
                    uploadedImagePreview.style.display = 'block';
                    uploadPlaceholder.style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        });

        function resetUI() {
            resultImage.style.display = 'none';
            resultsDiv.style.display = 'none';
            captureBtn.style.display = 'block';
            resetBtn.style.display = 'none';
            loadingDiv.style.display = 'none';
            
            // Clear results
            document.getElementById('shoulderWidth').textContent = '-';
            document.getElementById('hipWidth').textContent = '-';
            document.getElementById('armLength').textContent = '-';
        }

        captureBtn.addEventListener('click', async () => {
            const height = heightInput.value;
            if (!height) {
                alert("Please enter your height first.");
                return;
            }

            const formData = new FormData();
            formData.append('height', height);

            if (currentMode === 'camera') {
                // Capture from video
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                
                await new Promise(resolve => canvas.toBlob(blob => {
                    formData.append('image', blob, 'capture.jpg');
                    resolve();
                }, 'image/jpeg'));
                
                video.pause();
            } else {
                // Use uploaded file
                const file = fileInput.files[0];
                if (!file) {
                    alert("Please select a photo first.");
                    return;
                }
                formData.append('image', file);
            }

            // Show loading
            loadingDiv.style.display = 'block';
            resultsDiv.style.display = 'none';
            captureBtn.style.display = 'none';

            try {
                const response = await fetch('/measure', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                loadingDiv.style.display = 'none';
                
                if (data.error) {
                    alert("Error: " + data.error);
                    if (currentMode === 'camera') video.play();
                    captureBtn.style.display = 'block';
                    return;
                }

                // Display results
                document.getElementById('shoulderWidth').textContent = data.shoulder_width_cm + ' cm';
                document.getElementById('hipWidth').textContent = data.hip_width_cm + ' cm';
                document.getElementById('armLength').textContent = data.arm_length_cm + ' cm';
                resultsDiv.style.display = 'block';
                
                // Display processed image
                if (data.image_base64) {
                    resultImage.src = 'data:image/jpeg;base64,' + data.image_base64;
                    
                    // Hide other previews
                    video.style.display = 'none';
                    uploadedImagePreview.style.display = 'none';
                    guideOverlay.style.display = 'none';
                    uploadPlaceholder.style.display = 'none';
                    
                    resultImage.style.display = 'block';
                    resetBtn.style.display = 'block';
                }

            } catch (err) {
                console.error("Error:", err);
                loadingDiv.style.display = 'none';
                captureBtn.style.display = 'block';
                alert("An error occurred while processing.");
                if (currentMode === 'camera') video.play();
            }
        });
        
        resetBtn.addEventListener('click', () => {
            resetUI();
            if (currentMode === 'camera') {
                video.style.display = 'block';
                guideOverlay.style.display = 'flex';
                video.play();
            } else {
                uploadedImagePreview.style.display = 'block';
                // If no file selected yet, show placeholder
                if (!fileInput.files[0]) {
                    uploadedImagePreview.style.display = 'none';
                    uploadPlaceholder.style.display = 'block';
                }
            }
        });
    </script>
</body>
</html>
