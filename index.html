<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TailorAI - Body Measurement</title>
    <style>
        :root {
            --primary-color: #6366f1;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            padding: 20px;
            text-align: center;
            background-color: var(--card-bg);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin: 0;
            font-weight: 700;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        main {
            max-width: 800px;
            width: 100%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .camera-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            background-color: #000;
        }

        video, canvas {
            width: 100%;
            display: block;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            max-width: 640px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.9rem;
            color: #94a3b8;
        }

        input[type="number"] {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #334155;
            color: white;
            font-size: 1rem;
        }

        button {
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: var(--primary-color);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #4f46e5;
        }

        #results {
            margin-top: 20px;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            display: none;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #334155;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .loading {
            display: none;
            text-align: center;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <header>
        <h1>TailorAI Measurement</h1>
    </header>

    <main>
        <div class="camera-container">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas" style="display:none;"></canvas>
        </div>

        <div class="controls">
            <div class="input-group">
                <label for="height">Your Height (cm)</label>
                <input type="number" id="height" placeholder="e.g., 175" value="170">
            </div>
            <button id="captureBtn">Capture & Measure</button>
        </div>

        <div id="loading" class="loading">Processing image...</div>

        <div id="results">
            <h3>Measurements</h3>
            <div class="result-item">
                <span>Shoulder Width</span>
                <span id="shoulderWidth">-</span>
            </div>
            <div class="result-item">
                <span>Hip Width</span>
                <span id="hipWidth">-</span>
            </div>
            <div class="result-item">
                <span>Arm Length</span>
                <span id="armLength">-</span>
            </div>
        </div>
    </main>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('captureBtn');
        const heightInput = document.getElementById('height');
        const resultsDiv = document.getElementById('results');
        const loadingDiv = document.getElementById('loading');

        // Access Camera
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
            } catch (err) {
                console.error("Error accessing camera:", err);
                alert("Could not access camera. Please ensure you have given permission.");
            }
        }

        startCamera();

        captureBtn.addEventListener('click', async () => {
            const height = heightInput.value;
            if (!height) {
                alert("Please enter your height first.");
                return;
            }

            // Capture frame
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);

            // Convert to blob
            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('image', blob, 'capture.jpg');
                formData.append('height', height);

                // Show loading
                loadingDiv.style.display = 'block';
                resultsDiv.style.display = 'none';

                try {
                    const response = await fetch('/measure', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await response.json();

                    loadingDiv.style.display = 'none';
                    
                    if (data.error) {
                        alert("Error: " + data.error);
                        return;
                    }

                    // Display results
                    document.getElementById('shoulderWidth').textContent = data.shoulder_width_cm + ' cm';
                    document.getElementById('hipWidth').textContent = data.hip_width_cm + ' cm';
                    document.getElementById('armLength').textContent = data.arm_length_cm + ' cm';
                    resultsDiv.style.display = 'block';

                } catch (err) {
                    console.error("Error:", err);
                    loadingDiv.style.display = 'none';
                    alert("An error occurred while processing.");
                }
            }, 'image/jpeg');
        });
    </script>
</body>
</html>
